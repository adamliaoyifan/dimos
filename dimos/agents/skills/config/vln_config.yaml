# VLN (Vision-and-Language Navigation) Configuration
# ---------------------------------------------------
# Usage:
#   from dimos.agents.skills.config import load_vln_config
#   cfg = load_vln_config("path/to/vln_config.yaml")

# ── VLM (Vision-Language Model) ──────────────────────────────────────
vlm:
  # Backend: "qwen3_local" (custom Qwen3-VL server), "qwen_local" (OpenAI-compat),
  #          "qwen" (Alibaba cloud), "moondream" (local HF)
  backend: qwen3_local

  # Custom Qwen3-VL-8B server on RTX 5090 (no /v1 suffix — endpoints include it)
  base_url: http://192.168.2.109:8000
  model_name: Qwen3-VL-8B-Instruct

# ── Agent LLM ────────────────────────────────────────────────────────
agent:
  # Ollama Qwen3 14B on the same host
  model: ollama:qwen3:14b
  ollama_base_url: http://192.168.2.109:11434

# ── Search behaviour ─────────────────────────────────────────────────
search:
  vlm_check_interval: 1.0
  search_timeout: 120.0
  approach_timeout: 30.0
  similarity_threshold: 0.23
  # Exploration backend: "astar" (WavefrontFrontier + A*) or "navdp" (diffusion-policy nogoal).
  # Use "navdp" to test NavDP server trajectory generation in isolation.
  exploration_mode: navdp #astar
  # Detection confirmation tuning
  confirm_checks: 3         # VLM queries per heading
  confirm_threshold: 2      # required positives out of confirm_checks (standard headings)
  confirm_rotate_deg: 20.0  # degrees to rotate between heading attempts (< camera HFOV ~38°)
  confirm_check_delay: 1.5  # seconds between checks (ensures fresh frame + server breathing room)
  # Overrun recovery: if the VLM call takes too long and the robot moves
  # more than this distance past where the image was captured, drive back
  # to the capture pose before confirming.
  max_overrun_m: 0.5

# ── NavDP (diffusion-policy navigation) ────────────────────────────
# Set enabled: true if NavDP inference server is running
navdp:
  enabled: true
  navdp_server_url: http://192.168.2.109:8880
  vlm_server_url: http://192.168.2.109:8000

  # Active trajectory camera profile.  Must match a key in ``cameras:`` below.
  # Use "go2" in simulation; use "realsense_d435" in real deployment when the
  # RealSense is mounted and wired to the navdp_image / navdp_depth streams.
  trajectory_camera: go2

  # Camera profiles — add or override entries here.
  # Each entry becomes a CameraConfig that can be selected via trajectory_camera.
  cameras:
    # Unitree Go2 built-in RGB camera (used in MuJoCo sim and as VLM camera).
    # Intrinsic is calibrated from bridge_params.yaml defaults.
    go2:
      intrinsic:
        - [460.0, 0.0, 320.0]
        - [0.0, 460.0, 240.0]
        - [0.0, 0.0, 1.0]
      x: 0.13       # forward offset from base centre (m)
      y: 0.00       # lateral offset — positive = left (m)
      z: 0.30       # height above ground (m)
      pitch: 0.157  # downward tilt in radians (~9°)
      width: 640
      height: 480
      fps: 30

    # Intel RealSense D435 mounted forward-facing (real deployment only).
    # Replace intrinsic values with your actual calibration.
    realsense_d435:
      intrinsic:
        - [614.0, 0.0, 320.0]
        - [0.0, 614.0, 240.0]
        - [0.0, 0.0, 1.0]
      x: 0.15       # slightly more forward than Go2 camera
      y: 0.00
      z: 0.28
      pitch: 0.10   # ~6° downward tilt
      width: 640
      height: 480
      fps: 30

  # Graceful network-failure: hold last velocity then decelerate to zero.
  # Trajectories are in local frame — they CANNOT be replayed after the
  # robot moves, so we hold/decel rather than replaying stale data.
  hold_duration_s: 0.3   # hold last (v,w) for this many seconds
  decel_duration_s: 0.5  # then decelerate linearly to zero over this window

  # VLM control: set false in VLN deployments so VLNSkillContainer owns all
  # scene understanding and the two VLM loops do not conflict.
  enable_internal_vlm: false

  # Trajectory controller tuning (matched to bridge defaults)
  mpc_horizon: 15
  mpc_desired_v: 0.2
  mpc_v_max: 0.3
  mpc_w_max: 0.2
  mpc_ref_gap: 3
  goal_lookahead_m: 1.0

  # Trajectory selector — costmap/LiDAR collision check across all
  # NavDP candidate trajectories.  When enabled, the lowest-cost
  # collision-free trajectory is chosen; if ALL collide the robot
  # stops and waits for the next inference cycle.
  trajectory_selector:
    enabled: true
    cost_threshold: 50       # cells >= this are lethal (matches A*)
    unknown_penalty: 0.8      # fraction of cost_threshold for unknown cells
    critic_weight: 0.2        # reward weight for NavDP critic score
    costmap_weight: 0.8       # multiplier for accumulated costmap cost
    collision_penalty: 1000.0 # flat penalty per lethal cell hit
    robot_length: 0.6         # full length of robot front-to-rear (metres)
    robot_half_width: 0.15    # half the width of robot side-to-side (metres)
    robot_radius: 0.30        # circumscribing radius for LiDAR fallback (metres)
    horizon_m: 1.5            # only check waypoints within this distance
    sample_step: 2            # evaluate every N-th waypoint
    max_trajectory_cost: 50.0 # reject trajectories above this combined cost (null = disabled)
    explore_weight: 5.0       # multiplier for exploration cost (only active during SEEK)
    explore_radius: 2.0       # metres; penalty decays to zero at this distance from explored path
    explore_endpoint_bonus: 1.0  # bonus weight for trajectory endpoints heading into novel territory
    depth_obstacle_m: 0.5        # metres; depth below this in centre of image → penalise forward trajectories (0=off)

# ── Escape / stuck recovery ───────────────────────────────────────
escape:
  enabled: true
  stuck_time_window: 6.0
  stuck_distance_threshold: 0.05
  escape_backup_distance: 0.3
  escape_rotate_degrees: 90.0
  max_escape_attempts: 4

# ── Blueprint options ────────────────────────────────────────────────
blueprint:
  enable_tts: false
  n_workers: 8

# ── Simulation ──────────────────────────────────────────────────────
# Set enabled: true when running in simulation (dimos --simulation)
# The vlm_prompt_prefix is prepended to EVERY VLM query to help the model
# understand that images are 3D-rendered, not real photos.
simulation:
  enabled: true
  vlm_prompt_prefix: >-
    IMPORTANT: This image is from a 3D simulation, NOT a real camera.
    The scene uses simple 3D-rendered graphics with flat shading, basic
    geometry, and minimal textures. Objects may look like low-poly 3D
    models (e.g. a desk is a simple rectangular shape, chairs are basic
    shapes). Interpret objects by their SHAPE and POSITION, not by
    photorealistic appearance. A rectangular shape on legs is likely a
    desk or table. A shape with a seat and backrest is a chair.
